services:
  ontap:
    # :latest is deliberate — OnTap is a turnkey wrapper and should pick up
    # upstream Libation fixes on pull/restart rather than pin and go stale.
    image: rmcrackan/libation:latest
    container_name: ontap
    restart: unless-stopped
    environment:
      - SLEEP_TIME=${SLEEP_TIME:-1h}
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${BOOKS_PATH:-./books}:/data
